<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family & Guest Shopping List - ระบบซื้อของเข้าบ้าน</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 bg-slate-950 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md p-8 shadow-2xl flex flex-col gap-6">
            <div class="text-center space-y-2">
                <div class="inline-block bg-emerald-600 text-white p-3 rounded-2xl font-bold text-2xl shadow-lg mb-2">🛒</div>
                <h1 class="text-2xl font-bold text-slate-100">ระบบรายการซื้อของ</h1>
                <p class="text-xs text-slate-400">กรอกรหัสผ่านครอบครัว หรือเข้าใช้งานในฐานะแขก</p>
            </div>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">รหัสผ่านสำหรับสมาชิกครอบครัว</label>
                    <input type="password" id="login-password-input" placeholder="กรอกรหัสผ่านกลาง..." required
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-emerald-500 font-mono">
                </div>
                <div id="login-error" class="text-red-400 text-xs hidden text-center">❌ รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง</div>
                
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-medium text-sm transition shadow cursor-pointer">
                    🏠 เข้าสู่ระบบ (โหมดครอบครัว)
                </button>
            </form>

            <div id="guest-container">
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-slate-700"></div>
                    <span class="flex-shrink mx-4 text-xs text-slate-500">หรือ</span>
                    <div class="flex-grow border-t border-slate-700"></div>
                </div>

                <button id="guest-login-btn" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 py-3 rounded-xl font-medium text-sm transition shadow cursor-pointer">
                    👥 เข้าใช้งานแบบโหมด Guest (บุคคลภายนอก)
                </button>
            </div>
            <div id="guest-disabled-notice" class="text-center text-xs text-red-400/8
